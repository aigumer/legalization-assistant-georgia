[project]
name = "legalization-assistant-georgia"
version = "0.1.0"
description = "RAG assistant for questions about visas and legalization in Georgia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.6.0",
    "minsearch>=0.2.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pypdf>=6.16.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legalization_assistant"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
