<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="320" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .box  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
      .llm  { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 8; }
      .eval { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .t    { fill: #1f2328; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .s    { fill: #57606a; font-size: 11.5px; text-anchor: middle; }
      .f    { fill: #8c959f; font-size: 10.5px; text-anchor: middle; font-style: italic; }
      .line { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #16a34a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="20" y="30" fill="#1f2328" font-size="15" font-weight="700">Georgia Visa &amp; Legalization Assistant — RAG pipeline</text>

  <!-- main pipeline -->
  <rect class="box" x="20" y="120" width="140" height="70"/>
  <text class="t" x="90" y="147">Source PDFs</text>
  <text class="s" x="90" y="166">data/raw/</text>
  <text class="f" x="90" y="182">59 pages</text>

  <rect class="box" x="200" y="120" width="150" height="70"/>
  <text class="t" x="275" y="147">ingest.py</text>
  <text class="s" x="275" y="166">article-level chunks</text>
  <text class="f" x="275" y="182">93 articles → 162 chunks</text>

  <rect class="box" x="390" y="120" width="150" height="70"/>
  <text class="t" x="465" y="147">minsearch Index</text>
  <text class="s" x="465" y="166">title ×3 · diversified</text>
  <text class="f" x="465" y="182">top-k excerpts</text>

  <rect class="llm" x="580" y="120" width="150" height="70"/>
  <text class="t" x="655" y="147">gpt-oss-120b</text>
  <text class="s" x="655" y="166">grounded answer · Groq</text>
  <text class="f" x="655" y="182">inline citations</text>

  <rect class="box" x="770" y="120" width="150" height="70"/>
  <text class="t" x="845" y="147">Streamlit</text>
  <text class="s" x="845" y="166">chat + source panel</text>
  <text class="f" x="845" y="182">streamed</text>

  <line class="line" x1="162" y1="155" x2="196" y2="155"/>
  <line class="line" x1="352" y1="155" x2="386" y2="155"/>
  <line class="line" x1="542" y1="155" x2="576" y2="155"/>
  <line class="line" x1="732" y1="155" x2="766" y2="155"/>

  <!-- the question enters retrieval, translated first only if not Latin script -->
  <text class="t" x="465" y="48">user question</text>
  <rect class="llm" x="390" y="62" width="150" height="46"/>
  <text class="s" x="465" y="81">gpt-oss-20b</text>
  <text class="f" x="465" y="97">non-Latin query → EN</text>
  <line class="line" x1="465" y1="54" x2="465" y2="58"/>
  <line class="line" x1="465" y1="110" x2="465" y2="116"/>

  <!-- evaluation branch -->
  <rect class="eval" x="330" y="240" width="270" height="58"/>
  <text class="t" x="465" y="264">scripts/evaluate_retrieval.py</text>
  <text class="s" x="465" y="283">hit rate @5 97.1% · MRR 0.832</text>
  <path class="dash" d="M 465 194 L 465 236"/>
</svg>
